<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Proyectos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
        }
        .navbar {
            border-bottom: 1px solid #dee2e6;
        }
        footer {
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        /* Estilo del encabezado del modal replicando el azul vibrante del mockup */
        .modal-header-custom {
            background-color: #0d6efd;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-dark" href="index.html">Mi Portafolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-medium" aria-current="page" href="projects.html">Proyectos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <span class="badge text-bg-primary mb-3 px-3 py-2">
                    <i class="fa-solid fa-folder-open me-2"></i>Portafolio
                </span>
                <h1 class="display-5 fw-bold page-heading mb-4">Mis Proyectos</h1>

                <!-- Grilla de Proyectos (alineada como en el mockup) -->
                <div class="row g-4 mt-2">
                    
                    <!-- Proyecto 1 -->
                    <div class="col-md-6">
                        <article class="project-card">
                            <span class="project-icon"><i class="fa-solid fa-road"></i></span>
                            <h2 class="h4">Vía 360</h2>
                            <p class="text-muted">Aplicación enfocada en incidentes viales.</p>
                            <button type="button"
                                    class="btn btn-primary btn-ver-proyecto"
                                    data-bs-toggle="modal"
                                    data-bs-target="#proyectoModal"
                                    data-titulo="Vía 360"
                                    data-descripcion="Aplicación enfocada en incidentes viales."
                                    data-tecnologias=""
                                    data-github="https://github.com/Jerson570/Via360">
                                <i class="fa-solid fa-circle-info me-2"></i>Ver Detalles
                            </button>
                        </article>
                    </div>

                    <!-- Proyecto 2 -->
                    <div class="col-md-6">
                        <article class="project-card">
                            <span class="project-icon"><i class="fa-solid fa-rocket"></i></span>
                            <h2 class="h4">Astroplay</h2>
                            <p class="text-muted">Juego educativo para aprender astronomía.</p>
                            <button type="button"
                                    class="btn btn-primary btn-ver-proyecto"
                                    data-bs-toggle="modal"
                                    data-bs-target="#proyectoModal"
                                    data-titulo="Astroplay"
                                    data-descripcion="Juego educativo que enseña astronomía."
                                    data-tecnologias=""
                                    data-github="">
                                <i class="fa-solid fa-circle-info me-2"></i>Ver Detalles
                            </button>
                        </article>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Ventana Modal Única (Dinámica con jQuery) -->
    <div class="modal fade" id="proyectoModal" tabindex="-1" aria-labelledby="proyectoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <!-- Cabecera azul como en tu imagen -->
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title fw-normal" id="proyectoModalLabel">Detalles del proyecto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                
                <!-- Cuerpo del modal reemplazando el video -->
                <div class="modal-body p-4">
                    <h6 class="fw-bold text-dark mb-2">
                        <i class="fa-solid fa-circle-info text-primary me-1"></i> Descripción del Proyecto
                    </h6>
                    <p id="modalDescripcion" class="text-muted mb-4">
                    </p>

                    <h6 id="modalTecnologiasTitulo" class="fw-bold text-dark mb-2">
                        <i class="fa-solid fa-layer-group text-primary me-1"></i> Tecnologías Utilizadas
                    </h6>
                    <div id="modalTecnologias" class="d-flex flex-wrap gap-2 mb-3">
                        <!-- Los badges de tecnologías se insertan aquí vía jQuery -->
                    </div>
                </div>

                <!-- Pie del modal con enlace a GitHub y botón Cerrar -->
                <div class="modal-footer justify-content-between">
                    <a id="modalGithubLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-dark">
                        <i class="fa-brands fa-github me-1"></i> Ver en GitHub
                    </a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="py-4 text-center text-muted mt-auto">
        <div class="container">
            <small>© 2026 Santiago Tepud Castaño</small>
        </div>
    </footer>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica con jQuery para rellenar el modal -->
    <script>
        $(document).ready(function() {
            $('.btn-ver-proyecto').on('click', function() {
                // 1. Obtener los datos del botón presionado
                const titulo = $(this).data('titulo');
                const descripcion = $(this).data('descripcion');
                const tecnologias = $(this).data('tecnologias').split(',');
                const githubUrl = $(this).data('github');

                // 2. Actualizar textos y enlaces en el modal
                $('#proyectoModalLabel').text(titulo);
                $('#modalDescripcion').text(descripcion);
                $('#modalGithubLink')
                    .attr('href', githubUrl)
                    .toggle(Boolean(githubUrl));

                // 3. Generar etiquetas (badges) visuales para cada tecnología
                const $contenedorTech = $('#modalTecnologias');
                $contenedorTech.empty(); // Limpiar tecnologías anteriores
                $('#modalTecnologiasTitulo').toggle(tecnologias.some(function(tech) {
                    return tech.trim().length > 0;
                }));

                $.each(tecnologias, function(index, tech) {
                    if (tech.trim().length > 0) {
                        const badge = `<span class="badge bg-light text-dark border px-3 py-2">${tech.trim()}</span>`;
                        $contenedorTech.append(badge);
                    }
                });
            });
        });
    </script>
</body>
</html>
